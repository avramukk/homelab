apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: landing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: landing
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
      ports:
        - port: 8080
          protocol: TCP
