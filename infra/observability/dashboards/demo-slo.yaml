apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-demo-slo
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Demo
data:
  demo-slo.json: |
    {
      "title": "Demo · SLO & error budget",
      "uid": "demo-slo",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "tags": ["demo", "slo"],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability (1h)",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.99,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "orange", "value": 0.995 },
                { "color": "green", "value": 0.998 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "1 - demo:error_ratio:rate1h", "legendFormat": "availability" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Burn rate (1h, budget 0.5%)",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 6 },
                { "color": "red", "value": 14.4 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "demo:error_ratio:rate1h / 0.005", "legendFormat": "burn rate" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency (10m) vs 300ms SLO",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 0.3 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "demo:latency_p95:rate10m", "legendFormat": "p95" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active demo alerts",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "expr": "count(ALERTS{alertname=~\"Demo.*\", alertstate=\"firing\"}) or vector(0)", "legendFormat": "firing" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Error ratio across burn-rate windows",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "custom": { "lineWidth": 2 } },
            "overrides": []
          },
          "targets": [
            { "expr": "demo:error_ratio:rate5m", "legendFormat": "5m" },
            { "expr": "demo:error_ratio:rate30m", "legendFormat": "30m" },
            { "expr": "demo:error_ratio:rate1h", "legendFormat": "1h" },
            { "expr": "demo:error_ratio:rate6h", "legendFormat": "6h" }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "SLO alerts",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "ALERTS{alertname=~\"Demo.*\"}", "format": "table", "instant": true }
          ]
        }
      ]
    }
