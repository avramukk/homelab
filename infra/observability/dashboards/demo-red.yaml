apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-demo-red
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Demo
data:
  demo-red.json: |
    {
      "title": "Demo · RED",
      "uid": "demo-red",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["demo", "red"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate by route (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum by (route) (rate(http_requests_total{job=\"demo\"}[5m]))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio (5xx / total)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2 } },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"demo\", status_class=\"5xx\"}[5m])) / sum(rate(http_requests_total{job=\"demo\"}[5m]))", "legendFormat": "error ratio" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } }, "overrides": [] },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"demo\"}[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"demo\"}[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"demo\"}[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests by status class (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "sum by (status_class) (rate(http_requests_total{job=\"demo\"}[5m]))", "legendFormat": "{{status_class}}" }
          ]
        }
      ]
    }
