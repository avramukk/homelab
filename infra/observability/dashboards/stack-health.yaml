apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stack-health
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
data:
  stack-health.json: |
    {
      "title": "Stack health",
      "uid": "stack-health",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["observability"],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape targets up",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [ { "expr": "sum(up == 1)", "legendFormat": "up" } ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Targets down",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "targets": [ { "expr": "sum(up == 0) or vector(0)", "legendFormat": "down" } ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Prometheus head series",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [ { "expr": "prometheus_tsdb_head_series", "legendFormat": "series" } ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Scrape health by job",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 }, "overrides": [] },
          "targets": [ { "expr": "sum by (job) (up)", "legendFormat": "{{job}}" } ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Loki · Tempo · Alloy availability",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [ { "expr": "up{job=~\"loki.*|tempo.*|alloy.*\"}", "legendFormat": "{{job}}" } ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request rate into Loki / Tempo (bytes/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [ { "expr": "sum by (job) (rate(loki_distributor_bytes_received_total[5m]))", "legendFormat": "loki in" } ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Alertmanager notifications",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [ { "expr": "sum by (integration) (rate(alertmanager_notifications_total[5m]))", "legendFormat": "{{integration}}" } ]
        }
      ]
    }
