# kube-prometheus-stack — the metrics backbone of the LGTM stack (ADR-007).
# Tuned for a small cluster (3 nodes, ~12 GiB): short retention, conservative
# scrape intervals, explicit resource limits.
crds:
  enabled: true

prometheus:
  prometheusSpec:
    # Retention must exceed the longest SLO burn-rate window (rate6h).
    retention: 12h
    # Conservative interval keeps sample rate (and cardinality) low.
    scrapeInterval: 60s
    evaluationInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Receivers (Telegram, page/ticket routing) land with ADR-009.

grafana:
  enabled: true
  # Admin credentials come from a SealedSecret (keys: admin-user, admin-password).
  admin:
    existingSecret: grafana-admin
  # Grafana is NOT public (ADR-020): it is reachable only over Tailscale
  # (`kubectl port-forward`), so anonymous access stays disabled.
  # Datasources as code. Prometheus is added by the chart as the default.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.observability.svc.cluster.local
      access: proxy
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# k3s does not run kube-proxy / kube-scheduler / kube-controller-manager as
# scrapeable targets; leaving them enabled produces permanently firing false
# alerts (KubeProxyDown, KubeSchedulerDown, KubeControllerManagerDown).
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
