# Tempo — single binary, local trace storage (ADR-007).
tempo:
  retention: 24h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi

serviceMonitor:
  enabled: true
  # Selected by the kube-prometheus-stack Prometheus (release label).
  labels:
    release: kube-prometheus-stack
