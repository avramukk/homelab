# node-exporter needs hostNetwork/hostPID and hostPath, so `restricted` cannot be
# enforced here; violations are still reported via audit/warn.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
