# Namespaces are owned here (with Pod Security labels) so every other application
# can rely on them existing. `enforce` is set only where the workloads are proven
# compliant; elsewhere `audit` + `warn` surface violations without blocking pods.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
