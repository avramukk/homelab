apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.6.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/infra/traefik/values.yaml
    - repoURL: https://github.com/avramukk/homelab.git
      targetRevision: main
      ref: values
    # Private hostnames routed by Traefik + the Cloudflare DNS token SealedSecret.
    - repoURL: https://github.com/avramukk/homelab.git
      targetRevision: main
      path: infra/traefik/manifests
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
