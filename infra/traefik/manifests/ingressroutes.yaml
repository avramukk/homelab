# Private hostnames: resolvable only on the tailnet (A → tailnet IP), routed by
# Traefik over TLS. Each IngressRoute lives in the namespace of its Service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.avramukk.com`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.avramukk.com`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo
  namespace: demo
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`demo.avramukk.com`)
      kind: Rule
      services:
        - name: demo
          port: 80
  tls:
    certResolver: letsencrypt
