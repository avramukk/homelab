# Private hostnames: resolvable only on the tailnet (A → tailnet IP), routed by
# Traefik over TLS. Each IngressRoute lives in the namespace of its Service.
#
# A `tailnet-only` middleware is attached to every route: only addresses inside
# Tailscale's CGNAT range (100.64.0.0/10) may reach them. A request arriving from
# the LAN with the same Host header is rejected with 403 — the services are
# genuinely unreachable outside the tailnet, not merely unadvertised.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: observability
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: demo
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.avramukk.com`)
      kind: Rule
      middlewares:
        - name: tailnet-only
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.avramukk.com`)
      kind: Rule
      middlewares:
        - name: tailnet-only
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo
  namespace: demo
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`demo.avramukk.com`)
      kind: Rule
      middlewares:
        - name: tailnet-only
      services:
        - name: demo
          port: 80
  tls:
    certResolver: letsencrypt
